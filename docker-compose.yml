version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: roofing_db
    environment:
      POSTGRES_DB: roofing_db
      POSTGRES_USER: roofing_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - roofing_network
    restart: unless-stopped

  # Redis for caching and background jobs
  redis:
    image: redis:7-alpine
    container_name: roofing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - roofing_network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: roofing_backend
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://roofing_user:${DB_PASSWORD:-secure_password}@postgres:5432/roofing_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY="${FIREBASE_PRIVATE_KEY}"
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - roofing_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Worker (Celery)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: roofing_worker
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://roofing_user:${DB_PASSWORD:-secure_password}@postgres:5432/roofing_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - roofing_network
    restart: unless-stopped

  # Celery Beat Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: roofing_scheduler
    command: celery -A app.celery beat --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://roofing_user:${DB_PASSWORD:-secure_password}@postgres:5432/roofing_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - roofing_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: roofing_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/var/www/html
    depends_on:
      - backend
    networks:
      - roofing_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  roofing_network:
    driver: bridge

# Production Environment Variables
# Create a .env file with the following variables:
# DB_PASSWORD=your_secure_password
# SECRET_KEY=your_secret_key
# JWT_SECRET_KEY=your_jwt_secret_key
# STRIPE_SECRET_KEY=sk_test_your_stripe_secret_key
# TWILIO_ACCOUNT_SID=your_twilio_account_sid
# TWILIO_AUTH_TOKEN=your_twilio_auth_token
# SENDGRID_API_KEY=SG.your_sendgrid_api_key
# OPENAI_API_KEY=sk_your_openai_api_key
# FIREBASE_PROJECT_ID=your_firebase_project_id
# FIREBASE_PRIVATE_KEY="your_firebase_private_key"
# FIREBASE_CLIENT_EMAIL=your_firebase_client_email