plugins {
    id "com.android.application"
    // Flutter plugin configuration
}

android {
    namespace "com.roofingbusiness.app"
    compileSdkVersion 34
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.roofingbusiness.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildTypes {
        release {
            // Enable code shrinking
            minifyEnabled true

            // Resource shrinking
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )

            // Configure signing for release builds
            // You'll need to create a keystore and configure it here
            // For now, we'll use debug signing which works for development
            signingConfig signingConfigs.debug
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    // Configure signing
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // For release builds, you'll need to create a proper keystore
        // Run: keytool -genkey -v -keystore ~/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password
        // Then uncomment and configure:
        /*
        release {
            storeFile file('release.keystore')
            storePassword 'your_store_password'
            keyAlias 'release'
            keyPassword 'your_key_password'
        }
        */
    }

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Roofing Business Dev"
        }

        prod {
            dimension "default"
            resValue "string", "app_name", "Roofing Business"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
}